<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Eltanmia Company</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#fff}
    iframe{display:block;width:100%;height:100vh;border:0}
    .intro-splash{
      position:fixed;inset:0;z-index:9999;
      display:grid;place-items:center;
      width:100%;height:100%;padding:5vw;
      background:#fff;
      opacity:1;visibility:visible;
      transition:opacity .55s ease,visibility .55s ease;
    }
    .intro-splash img{
      display:block;width:min(94vw,1500px);height:min(88vh,850px);
      object-fit:contain;object-position:center;
    }
    .intro-splash.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
    @media(prefers-reduced-motion:reduce){.intro-splash{transition:none}}
  </style>
</head>
<body>
  <div class="intro-splash" id="introSplash" role="status" aria-label="Eltanmia Company">
    <img src="assets/logo--2026-11-12%20at%201.40.18%20PM.jpeg" alt="Eltanmia Company">
  </div>
  <iframe id="site" title="Eltanmia Company website"></iframe>
  <script>
    const frame=document.getElementById('site');
    const splash=document.getElementById('introSplash');
    let splashDismissed=false;
    function dismissSplash(){
      if(splashDismissed)return;
      splashDismissed=true;
      splash.classList.add('is-leaving');
      setTimeout(()=>splash.remove(),600);
    }
    frame.src='eltamia.html'+location.search+location.hash;
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc){setTimeout(dismissSplash,1800);return;}
      const stylesheet=doc.createElement('link');
      stylesheet.rel='stylesheet';
      stylesheet.href='assets/modern.css';
      doc.head.appendChild(stylesheet);
      const logoStylesheet=doc.createElement('link');
      logoStylesheet.rel='stylesheet';
      logoStylesheet.href='assets/logo.css?v=20261114-header-logo-large';
      doc.head.appendChild(logoStylesheet);

      const partnerStyles=doc.createElement('style');
      partnerStyles.textContent=`
        #clients .logos{display:grid!important;grid-template-columns:1fr!important;gap:26px!important;margin-top:30px!important;padding:0!important;overflow:visible!important}
        #clients .partner-group h3{margin:0 0 12px;color:#0b1f3a;font:700 19px/1.5 'Cairo',Arial,sans-serif}
        #clients .partner-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
        #clients .partner-item{min-height:68px;padding:14px 12px;display:grid;place-items:center;text-align:center;background:#fff;border:1px solid #e1e7ef;border-radius:12px;box-shadow:0 4px 14px rgba(11,31,58,.05);color:#2875d8;font-family:'Cairo',Arial,sans-serif;font-size:15px;font-weight:700;line-height:1.55;white-space:normal}
        @media(max-width:560px){#clients .partner-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}#clients .partner-item{min-height:64px;padding:10px 8px;font-size:13px}}
      `;
      doc.head.appendChild(partnerStyles);

      const partnerGroups=[
        {title:'العلامات التجارية',items:['Schneider Electric','Elsewedy Electric','ABB','Siemens','Legrand','Eaton','Philips','Prysmian','Nexans','Honeywell']},
        {title:'مكاتب الاستشارات الهندسية',items:['Crown Home للاستشارات الهندسية','Med للاستشارات الهندسية','محمود خليل المشنب للاستشارات الهندسية','ECG للاستشارات الهندسية','شاكر للاستشارات الهندسية','True Value للاستشارات الهندسية','محرم باخوم للاستشارات الهندسية']},
        {title:'الشركات والمصانع والمشروعات',items:['مصنع الرحاب','مصنع بيت الهندسة','المتحدة للكابلات المتخصصة','مصنع المتحدة للوحات','شركة نصيب توركوم','شركة توكل','دلتا ايجيبت للاضاءة','سيراج للاضاءة','اركو لكس للاضاءة','معرض سيراميك كليوباترا','مجموعة سيراميكا كليوباترا','فنادق سيراميكا كليوباترا','شركة الدورادو للتنمية السياحية','شركة كليوباترا للتنمية المتكاملة والاستثمار السياحي','شركة سيجما ارت الامارات','كمبوند دريم لاند','النساجون الشرقيون فندق سانتيدو','شركة اسكاس']}
      ];
      const logos=doc.querySelector('#clients .logos');
      if(logos){
        logos.innerHTML=partnerGroups.map(group=>`<div class="partner-group"><h3 dir="rtl">${group.title}</h3><div class="partner-grid">${group.items.map(name=>`<div class="partner-item" dir="auto">${name}</div>`).join('')}</div></div>`).join('');
        logos.setAttribute('aria-label','Partners and brands');
      }

      const profileLink=doc.querySelector('[data-i="profile"]');
      if(profileLink){
        profileLink.href='assets/Eltanmia%20company%20profile.pdf';
        profileLink.setAttribute('download','Eltanmia company profile.pdf');
      }
      const resize=()=>{frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px'};
      new ResizeObserver(resize).observe(doc.documentElement);
      new ResizeObserver(resize).observe(doc.body);
      setTimeout(resize,100);
      setTimeout(resize,800);
      window.addEventListener('resize',resize);
      setTimeout(dismissSplash,2000);
    });
    setTimeout(dismissSplash,7000);
  </script>
</body>
</html>
