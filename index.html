<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Eltanmia Company</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#fff}
    iframe{display:block;width:100%;height:100vh;border:0}
    .intro-splash{
      position:fixed;inset:0;z-index:9999;
      display:grid;place-items:center;
      width:100%;height:100%;padding:5vw;
      background:#fff;
      opacity:1;visibility:visible;
      transition:opacity .55s ease,visibility .55s ease;
    }
    .intro-splash img{
      display:block;width:min(94vw,1500px);height:min(88vh,850px);
      object-fit:contain;object-position:center;
    }
    .intro-splash.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
    @media(prefers-reduced-motion:reduce){.intro-splash{transition:none}}
  </style>
</head>
<body>
  <div class="intro-splash" id="introSplash" role="status" aria-label="Eltanmia Company">
    <img src="assets/logo--2026-11-12%20at%201.40.18%20PM.jpeg" alt="Eltanmia Company">
  </div>
  <iframe id="site" title="Eltanmia Company website"></iframe>
  <script>
    const frame=document.getElementById('site');
    const splash=document.getElementById('introSplash');
    let splashDismissed=false;
    function dismissSplash(){
      if(splashDismissed)return;
      splashDismissed=true;
      splash.classList.add('is-leaving');
      setTimeout(()=>splash.remove(),600);
    }
    frame.src='eltamia.html'+location.search+location.hash;
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc){setTimeout(dismissSplash,1800);return;}
      const stylesheet=doc.createElement('link');
      stylesheet.rel='stylesheet';
      stylesheet.href='assets/modern.css';
      doc.head.appendChild(stylesheet);
      const logoStylesheet=doc.createElement('link');
      logoStylesheet.rel='stylesheet';
      logoStylesheet.href='assets/logo.css?v=20261114-header-logo-large';
      doc.head.appendChild(logoStylesheet);
      const partnerStyles=doc.createElement('style');
      partnerStyles.textContent=`
        #clients .logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;align-items:stretch;margin-top:30px}
        #clients .logos .logo-item{background:#fff;border:1px solid rgba(17,31,58,.12);border-radius:12px;min-height:90px;display:grid;place-items:center;padding:12px;box-shadow:0 3px 10px rgba(11,31,58,.04)}
        #clients .logos .logo-item img{max-width:100%;max-height:52px;width:auto;object-fit:contain;display:block}
        @media(max-width:560px){#clients .logos{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#clients .logos .logo-item{min-height:74px;padding:10px}}
      `;
      doc.head.appendChild(partnerStyles);
      const partnerLogos=[
        {src:'https://upload.wikimedia.org/wikipedia/commons/5/5e/Schneider_Electric_Logo.svg',alt:'Schneider Electric'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/a/a7/Elsewedy_Electric.svg',alt:'Elsewedy Electric'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/5/51/ABB_logo.svg',alt:'ABB'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/9/9c/Siemens-logo.svg',alt:'Siemens'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/b/bd/Legrand_logo.svg',alt:'Legrand'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/c/c1/Eaton_Corporation_logo.svg',alt:'Eaton'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/6/65/Philips_logo_new.svg',alt:'Philips'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/7/7e/Prysmian_Group_Logo.svg',alt:'Prysmian'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/c/c2/Nexans_logo.svg',alt:'Nexans'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/a/aa/Honeywell_logo.svg',alt:'Honeywell'},
        {src:'https://www.ecgsa.com/wp-content/themes/ecgsa/assets/img/logo-en.svg',alt:'ECG Engineering Consultancy'},
        {src:'https://www.shakerconsultants.com/images/logo.svg',alt:'Shaker Engineering Consultancy'},
        {src:'https://www.deltaegypt.com/sites/all/themes/delta/images/logo.png',alt:'Delta Egypt Lighting'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/2/2a/Cleopatra_Group_logo.svg',alt:'Cleopatra Group'},
        {src:'https://upload.wikimedia.org/wikipedia/commons/7/7d/ACE_Moharram_Bakhoum_logo.svg',alt:'Moharram Bakhoum'}
      ];
      const logos=doc.querySelector('#clients .logos');
      if(logos){logos.innerHTML=partnerLogos.map(item=>`<div class="logo-item"><img src="${item.src}" alt="${item.alt}" title="${item.alt}"></div>`).join('');}
      const logo=doc.querySelector('header .logo');
      if(logo){
        const logoUrl=new URL('assets/logo--2026-11-12%20at%201.40.18%20PM.jpeg',frame.contentWindow.location.href).href;
        logo.style.setProperty('width','clamp(200px,24vw,280px)','important');
        logo.style.setProperty('height','76px','important');
        logo.style.setProperty('display','block','important');
        logo.style.setProperty('overflow','hidden','important');
        logo.style.setProperty('font-size','0','important');
        logo.style.setProperty('line-height','0','important');
        logo.style.setProperty('background-image',`url("${logoUrl}")`,'important');
        logo.style.setProperty('background-position','center','important');
        logo.style.setProperty('background-size','contain','important');
        logo.style.setProperty('background-repeat','no-repeat','important');
        logo.setAttribute('aria-label','Eltanmia Company');
        const bolt=logo.querySelector('i');
        if(bolt)bolt.style.setProperty('display','none','important');
      }
      const profileLink=doc.querySelector('[data-i="profile"]');
      if(profileLink){
        profileLink.href='assets/Eltanmia%20company%20profile.pdf';
        profileLink.setAttribute('download','Eltanmia company profile.pdf');
      }
      const resize=()=>{frame.style.height=Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px'};
      new ResizeObserver(resize).observe(doc.documentElement);
      new ResizeObserver(resize).observe(doc.body);
      setTimeout(resize,100);
      setTimeout(resize,800);
      window.addEventListener('resize',resize);
      setTimeout(dismissSplash,2000);
    });
    setTimeout(dismissSplash,7000);
  </script>
</body>
</html>
